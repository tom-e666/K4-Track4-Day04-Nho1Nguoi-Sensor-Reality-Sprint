name: Real-image YOLO benchmark
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-image-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: pip install -r requirements-yolo.txt
      - name: Fetch public road-scene sample
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 "https://ultralytics.com/images/bus.jpg" -o assets/bus.jpg
      - name: Run tests and benchmark
        run: |
          pytest -q
          rm -rf results
          python src/run_demo.py --input assets/bus.jpg --yolo --output-dir results
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-image-yolov8n-benchmark
          path: results/
      - name: Commit reproducible evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "Benchmark artifacts unchanged."
          else
            git commit -m "data: refresh real-image benchmark evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
