name: CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python src/run_demo.py --output-dir results-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-results
          path: results-smoke/
